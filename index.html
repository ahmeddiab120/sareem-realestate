========================================================= */
async function exportBackup(){
  if(denyIf('export')) return;
  try{
    const [materials, suppliers, prices, projects, project_quantities, purchase_orders, project_contractors] = await Promise.all([
      supabaseFetch('materials?select=*'),
      supabaseFetch('suppliers?select=*'),
      supabaseFetch('prices?select=*'),
      supabaseFetch('projects?select=*'),
      supabaseFetch('project_quantities?select=*'),
      supabaseFetch('purchase_orders?select=*'),
      supabaseFetch('project_contractors?select=*')
    ]);
    // Strip project_id from quantities for portability
    const quantitiesGrouped = {};
    for (const row of project_quantities) {
      const pid = row.project_id;
      if (!quantitiesGrouped[pid]) quantitiesGrouped[pid] = [];
      const { project_id, ...rest } = row;
      quantitiesGrouped[pid].push(rest);
    }
    const payload = {
      _meta: { app:'Material Cost Database', exported_at:new Date().toISOString(), version:3, backend:'supabase' },
      materials, suppliers, prices, projects,
      project_quantities: quantitiesGrouped,
      purchase_orders,
      project_contractors,
      active_project_id: ACTIVE_PROJECT_ID
    };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `نسخة_احتياطية_قاعدة_التكاليف_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('تم تنزيل النسخة الاحتياطية');
  }catch(err){
    console.error(err);
    toast('تعذر إنشاء النسخة الاحتياطية');
  }
}
async function triggerRestore(){
  if(denyIf('restore')) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !Array.isArray(data.materials) || !Array.isArray(data.suppliers)){
        toast('الملف غير صالح — تأكد أنه نسخة احتياطية من هذه الأداة'); return;
      }
      const prices = Array.isArray(data.prices) ? data.prices : [];
      const projects = Array.isArray(data.projects) ? data.projects : [];
      const orders = Array.isArray(data.purchase_orders) ? data.purchase_orders : [];
      const contractorRows = Array.isArray(data.project_contractors) ? data.project_contractors : [];
      let qtyRows = [];
      if (data.project_quantities && typeof data.project_quantities === 'object' && !Array.isArray(data.project_quantities)) {
        for (const [pid, items] of Object.entries(data.project_quantities)) {
          for (const item of items) {
            qtyRows.push({ ...item, project_id: pid });
          }
        }
      } else if (Array.isArray(data.project_quantities)) {
        qtyRows = data.project_quantities;
      }
      const ok = await askConfirm(`سيتم استبدال كل البيانات الحالية ببيانات النسخة الاحتياطية:<br>${data.materials.length} مادة، ${data.suppliers.length} مورد، ${prices.length} سعر، ${projects.length} مشروع، ${qtyRows.length} بند كميات، ${orders.length} أمر شراء، ${contractorRows.length} مقاول.<br>هل تريد المتابعة؟`, 'استعادة نسخة احتياطية', 'نعم، استعد');
      if(!ok) return;

      const wipeTable = async (table) => {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=neq.00000000-0000-0000-0000-000000000000`, {
          method: 'DELETE',
          headers: await authHeaders()
        });
        if (!res.ok) throw new Error(`wipe ${table} failed: ${res.status} ${await res.text()}`);
      };
      const insertTable = async (table, rows) => {
        if (!rows || rows.length === 0) return;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
          method: 'POST',
          headers: {
            ...(await authHeaders()),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(rows)
        });
        if (!res.ok) throw new Error(`insert ${table} failed: ${res.status} ${await res.text()}`);
      };

      // wipe children before parents and refill parents first; ids are kept so cross-table relations survive
      await wipeTable('project_quantities');
      await wipeTable('purchase_orders');
      await wipeTable('project_contractors');
      await wipeTable('prices');
      await wipeTable('projects');
      await wipeTable('suppliers');
      await wipeTable('materials');
      await insertTable('materials', data.materials);
      await insertTable('suppliers', data.suppliers);
      await insertTable('projects', projects);
      await insertTable('prices', prices);
      await insertTable('project_quantities', qtyRows);
      await insertTable('purchase_orders', orders);
      await insertTable('project_contractors', contractorRows);

      await loadAll();
      if (data.active_project_id && DB.projects.some(p=>p.id===data.active_project_id)) {
        ACTIVE_PROJECT_ID = data.active_project_id;
        await saveKey('active_project_id', ACTIVE_PROJECT_ID);
      }
      toast('تم استعادة النسخة الاحتياطية بنجاح');
      renderAll();
    }catch(err){
      console.error(err);
      toast('تعذرت الاستعادة — تأكد أن الملف نسخة احتياطية سليمة وحاول مجدداً');
    }
  };
  input.click();
}

// the price actually paid for a material inside one project, taken from the most
// recent purchase order: an order freezes its unit price when it is saved, so
// this is history and never moves with the prices table
function lastPurchaseInProject(projectId, materialId){
  const pos = DB.purchase_orders
    .filter(po=> po.project_id===projectId && po.status!=='ملغي'
      && (po.items||[]).some(it=> it.material_id===materialId))
    .sort((a,b)=> String(b.order_date||'').localeCompare(String(a.order_date||''))
      || String(b.po_number||'').localeCompare(String(a.po_number||'')));
  if(!pos.length) return null;
  const po = pos[0];
  const lines = (po.items||[]).filter(it=> it.material_id===materialId);
  const line = lines[lines.length-1];
  const sup = DB.suppliers.find(s=>s.id===po.supplier_id);
  return {
    price: Number(line.unit_price)||0,
    qty: Number(line.quantity)||0,
    date: po.order_date||'',
    po_number: po.po_number||'',
    supplier: sup ? sup.name : '—',
  };
}
// what the project actually paid on average, weighted by the ordered quantities:
// a material bought in several orders at different prices has no single real cost,
// and the newest order alone hides the rest of it
function averagePurchaseInProject(projectId, materialId){
  let qty = 0, value = 0;
  DB.purchase_orders.forEach(po=>{
    if(po.project_id!==projectId || po.status==='ملغي') return;
    (po.items||[]).forEach(it=>{
      if(it.material_id!==materialId) return;
      const q = Number(it.quantity)||0;
      qty += q;
      value += q * (Number(it.unit_price)||0);
    });
  });
  return qty>0 ? {avg: value/qty, qty} : null;
}

function exportCsv(tableId, filename){
  const table = document.getElementById(tableId);
  if(!table){ toast('لا يوجد جدول لتصديره'); return; }
  // a cell starting with = + - @ would run as a formula when opened in Excel
  const cell = v => '"' + (/^[=+\-@\t\r]/.test(v) ? "'" + v : v).replace(/"/g,'""') + '"';
  let csv = [];
  // the action-button column and the "no data" placeholder are chrome, not data
  table.querySelectorAll('tr:not(.empty-row)').forEach(tr=>{
    let row = [];
    tr.querySelectorAll('th:not(.no-export),td:not(.no-export)').forEach(td=> row.push(cell(td.textContent.trim())));
    csv.push(row.join(','));
  });
  const blob = new Blob(["\uFEFF"+csv.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const DELETE_USER_FN = SUPABASE_URL + '/functions/v1/delete-user';
async function deleteUser(i){
  if(denyIf('manage_users')) return;
  const u = (DB.user_roles||[])[i];
  if(!u) return;
  const email = String(u.email||'').trim().toLowerCase();
  if(email===CURRENT_USER_EMAIL){ toast('لا يمكنك حذف حسابك'); return; }
  if(u.role==='admin' && activeAdminsCount(i)===0){ toast('لا يمكن حذف آخر أدمن'); return; }
  if(!(await askConfirm(`حذف ${email} نهائياً؟ سيُغلق حسابه في النظام ويُحذف من قائمة المستخدمين، ولن يتمكن من الدخول مجدداً.`))) return;
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const res = await fetch(DELETE_USER_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization':'Bearer ' + ((session && session.access_token) || '') },
      body: JSON.stringify({ email })
    });
    const txt = await res.text();
    let out = null; try{ out = txt? JSON.parse(txt) : null; }catch(_){ out = null; }
    if(!res.ok) throw new Error((out && out.error) || (txt? txt.slice(0,140) : 'HTTP ' + res.status));
    DB.user_roles = (await supabaseFetch('user_roles?select=*')) || [];
    toast(out && out.account_deleted
      ? 'تم حذف المستخدم وحسابه نهائياً'
      : 'تم حذف المستخدم من القائمة — ما كانش له حساب دخول أصلاً');
    renderUsersTable();
  }catch(e){
    const m = String((e && e.message) || e);
    toast(/Failed to fetch|fetch|404/i.test(m)
      ? 'تعذّر الوصول إلى خدمة حذف المستخدمين — تأكد من نشر Edge Function باسم delete-user'
      : 'تعذر الحذف: ' + m.slice(0,150));
  }
}

const CREATE_USER_FN = SUPABASE_URL + '/functions/v1/create-user';
async function addUser(){
  if(denyIf('manage_users')) return;
  const email = String(document.getElementById('f_uemail').value||'').trim().toLowerCase();
  const password = String(document.getElementById('f_upass').value||'');
  const role = document.getElementById('f_urole').value;
  const projectId = document.getElementById('f_uproj').value || null;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('اكتب بريداً إلكترونياً صحيحاً'); return; }
  if(password && password.length < 8){ toast('كلمة المرور لازم تكون 8 حروف على الأقل'); return; }
  if(role==='engineer' && !projectId){ toast('اختر المشروع الخاص بمهندس الموقع'); return; }
  if(!password && !(DB.user_roles||[]).some(u=> String(u.email||'').toLowerCase()===email)){
    toast('أدخل كلمة مرور — هذا الحساب غير موجود بعد'); return;
  }
  const btn = document.getElementById('addUserBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارٍ الإضافة…'; }
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const res = await fetch(CREATE_USER_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_KEY, 'Authorization':'Bearer ' + ((session && session.access_token) || '') },
      body: JSON.stringify({ email, password, role, project_id: role==='engineer'? projectId : null })
    });
    const txt = await res.text();
    let out = null; try{ out = txt? JSON.parse(txt) : null; }catch(_){ out = null; }
    if(!res.ok) throw new Error((out && out.error) || (txt? txt.slice(0,140) : 'HTTP ' + res.status));
    DB.user_roles = (await supabaseFetch('user_roles?select=*')) || [];
    closeModal();
    toast(out && out.created ? 'تم إنشاء المستخدم وتحديد دوره' : 'الحساب موجود بالفعل — تم تحديث دوره');
    renderUsersTable();
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'إضافة'; }
    const m = String((e && e.message) || e);
    toast(/Failed to fetch|fetch|404/i.test(m)
      ? 'تعذّر الوصول إلى خدمة إضافة المستخدمين — تأكد من نشر Edge Function باسم create-user'
      : 'تعذرت الإضافة: ' + m.slice(0,150));
  }
}

const AUDIT_TABLE_LABELS = {prices:'سعر مادة', project_quantities:'بند كمية', purchase_orders:'أمر شراء', project_contractors:'مقاول'};
const AUDIT_ACTION_LABELS = {insert:'إضافة', update:'تعديل', delete:'حذف'};
const AUDIT_FIELD_LABELS = {
  material_id:'المادة', supplier_id:'المورد', selected_supplier_id:'المورد المحدد',

};
const AUDIT_NUMERIC_FIELDS = ['price','quantity','manual_price','contract_value','paid_amount'];
let AUDIT_ROWS = [];
let AUDIT_MISSING = false;
const AUDIT_FILTERS = {table_name:'', action:'', project_id:'', actor_email:'', from:'', to:''};
// everyone who shows up in the log, collected as batches arrive — the dropdown
// can only list users it has actually seen, since the server will not give a
// distinct list through PostgREST here
const AUDIT_ACTORS = new Set();
const AUDIT_NO_ACTOR = '__none__';

function auditActorLabel(email){
  const ur = (DB.user_roles||[]).find(u=> String(u.email||'').toLowerCase()===String(email).toLowerCase());
  return ur ? `${email} (${ROLE_LABELS[ur.role]||ur.role})` : email;
}
function syncAuditActorFilter(){
  const sel = document.getElementById('auditActorFilter');
  if(!sel) return;
  const cur = AUDIT_FILTERS.actor_email;
  const emails = [...AUDIT_ACTORS].filter(Boolean).sort((a,b)=> a.toLowerCase().localeCompare(b.toLowerCase()));
  sel.innerHTML = `<option value="">كل المستخدمين</option>`
    + emails.map(e=>`<option value="${esc(e)}" ${cur===e?'selected':''}>${esc(auditActorLabel(e))}</option>`).join('')
    + (AUDIT_ACTORS.has('')
        ? `<option value="${AUDIT_NO_ACTOR}" ${cur===AUDIT_NO_ACTOR?'selected':''}>غير معروف — تعديل مباشر في قاعدة البيانات</option>`
        : '');
}

function auditTime(ts){
  const d = new Date(ts);
  if(isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function auditVal(field, val){
  if(val===null || val===undefined || val==='') return '<span class="small-muted">فارغ</span>';
  if(field==='material_id'){ const m = DB.materials.find(x=>x.id===val); return esc(m? m.name_ar : 'سجل محذوف'); }
  if(field==='supplier_id' || field==='selected_supplier_id'){ const s = DB.suppliers.find(x=>x.id===val); return esc(s? s.name : 'سجل محذوف'); }
  if(field==='project_id'){ const pr = DB.projects.find(x=>x.id===val); return esc(pr? pr.name : 'سجل محذوف'); }
  if(field==='pricing_method'){ const pm = PRICING_METHODS.find(x=>x.v===val); return esc(pm? pm.l : String(val)); }
  if(field==='items') return `${Number(val)||0} بند`;
  if(AUDIT_NUMERIC_FIELDS.includes(field)) return `<span class="mono">${fmt(val)}</span>`;
  return esc(String(val));
}
function auditChanges(row){
  const ch = row.changes || {};
  const keys = Object.keys(ch);
  if(!keys.length) return `<span class="small-muted">${esc(AUDIT_ACTION_LABELS[row.action]||row.action||'')}</span>`;
  const one = k => {
    const c = ch[k] || {};
    const label = esc(AUDIT_FIELD_LABELS[k] || k);
    if(row.action==='insert') return `<div><b>${label}:</b> ${auditVal(k, c.to)}</div>`;
    if(row.action==='delete') return `<div><b>${label}:</b> ${auditVal(k, c.from)}</div>`;
    return `<div><b>${label}:</b> ${auditVal(k, c.from)} ← ${auditVal(k, c.to)}</div>`;
  };
  return keys.slice(0,6).map(one).join('')
    + (keys.length>6 ? `<div class="small-muted">و ${keys.length-6} تغييرات أخرى</div>` : '');
}
function setAuditFilter(key, val){
  AUDIT_FILTERS[key] = val;
  loadAuditRows();
}
function renderAudit(){
  const el = document.getElementById('panel-audit');
  if(!el) return;
  if(CURRENT_ROLE!=='admin'){

  }
  const f = AUDIT_FILTERS;
  el.innerHTML = `
    <div class="section-title">
      <div><h2>سجل التغييرات</h2><div class="desc">كل إضافة أو تعديل أو حذف على الأسعار والكميات وأوامر الشراء والمقاولين — السجل للقراءة فقط ولا يمكن تعديله من الموقع</div></div>
      <button class="btn sm" onclick="loadAuditRows(true)">تحديث</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <select onchange="setAuditFilter('table_name', this.value)">
          <option value="">كل الأنواع</option>

        <label class="datefield">إلى <input type="date" value="${f.to}" onchange="setAuditFilter('to', this.value)"></label>
        <button class="btn sm secondary" onclick="AUDIT_FILTERS.table_name='';AUDIT_FILTERS.action='';AUDIT_FILTERS.project_id='';AUDIT_FILTERS.actor_email='';AUDIT_FILTERS.from='';AUDIT_FILTERS.to='';renderAudit();">مسح الفلاتر</button>
      </div>
    </div>

    <div class="card"><div class="table-scroll" id="auditTableWrap"><div class="small-muted">جارٍ التحميل…</div></div></div>
  `;
  loadAuditRows();

async function loadAuditRows(notify){
  const wrap = document.getElementById('auditTableWrap');
  if(!wrap) return;
  if(!AUDIT_MISSING){
    wrap.innerHTML = `<div class="small-muted">جارٍ التحميل…</div>`;
    const f = AUDIT_FILTERS;
    const q = ['select=*','order=ts.desc','limit=500'];
    if(f.table_name) q.push(`table_name=eq.${encodeURIComponent(f.table_name)}`);
    if(f.action) q.push(`action=eq.${encodeURIComponent(f.action)}`);
    if(f.project_id) q.push(`project_id=eq.${encodeURIComponent(f.project_id)}`);
    if(f.actor_email && f.actor_email!==AUDIT_NO_ACTOR) q.push(`actor_email=eq.${encodeURIComponent(f.actor_email)}`);
    if(f.from) q.push(`ts=gte.${encodeURIComponent(f.from + 'T00:00:00')}`);
    if(f.to) q.push(`ts=lte.${encodeURIComponent(f.to + 'T23:59:59')}`);
    try{
      AUDIT_ROWS = (await supabaseFetch(`audit_log?${q.join('&')}`)) || [];
      AUDIT_ROWS.forEach(r=> AUDIT_ACTORS.add(String(r.actor_email||'')));
      // an empty actor_email means the change came from SQL, not the site; PostgREST
      // cannot filter on it reliably, so that one case is narrowed here
      if(f.actor_email===AUDIT_NO_ACTOR) AUDIT_ROWS = AUDIT_ROWS.filter(r=> !r.actor_email);
      syncAuditActorFilter();
    }catch(e){
      const m = String((e && e.message) || e);
      AUDIT_MISSING = /404|PGRST205/i.test(m);
      AUDIT_ROWS = [];
      if(!AUDIT_MISSING) toast('تعذّر تحميل سجل التغييرات: ' + m.slice(0,150));
    }
  }
  if(notify) toast('تم تحديث السجل');
  renderAuditTable();
}
function renderAuditTable(){
  const wrap = document.getElementById('auditTableWrap');
  if(!wrap) return;
  if(AUDIT_MISSING){
    wrap.innerHTML = `<div class="empty-row" style="text-align:center;padding:30px;">جدول سجل التغييرات (audit_log) غير موجود بعد في قاعدة البيانات — نفّذ الملف audit-log.sql في Supabase ثم حدّث الصفحة</div>`;
    return;
  }
  const rows = AUDIT_ROWS;
  wrap.innerHTML = `
    <table>
      <thead><tr><th>الوقت</th><th>المستخدم</th><th>النوع</th><th>العملية</th><th>البند</th><th>التغيير</th><th>المشروع</th></tr></thead>
      <tbody>
        ${rows.length? rows.map(r=>{
          const ur = (DB.user_roles||[]).find(u=> String(u.email||'').toLowerCase()===String(r.actor_email||'').toLowerCase());
          const pr = DB.projects.find(p=>p.id===r.project_id);
          return `<tr>
            <td class="mono">${auditTime(r.ts)}</td>
            <td class="mono">${r.actor_email? esc(r.actor_email) : '<span class="small-muted">غير معروف</span>'}${ur?` <span class="pill info">${esc(ROLE_LABELS[ur.role]||ur.role)}</span>`:''}</td>
            <td><span class="badge-cat">${esc(AUDIT_TABLE_LABELS[r.table_name]||r.table_name||'')}</span></td>
            <td>${esc(AUDIT_ACTION_LABELS[r.action]||r.action||'')}</td>
            <td>${esc(r.item_label||'—')}</td>
            <td>${auditChanges(r)}</td>
            <td>${pr? esc(pr.name) : '—'}</td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="7">لا توجد عمليات مطابقة للفلاتر المختارة</td></tr>`}
      </tbody>
    </table>
    <div class="small-muted" style="margin-top:8px;">المعروض ${rows.length} عملية — يعرض الموقع آخر 500 عملية كحد أقصى، استخدم الفلاتر للتضييق</div>
  `;
}

let appStarted = false;

function togglePassVisibility(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input || !btn) return;
  const reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  const open = btn.querySelector('.eye-open');
  const closed = btn.querySelector('.eye-closed');
  if(open) open.hidden = reveal;
  if(closed) closed.hidden = !reveal;
  const label = reveal ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('aria-pressed', String(reveal));
  btn.title = label;
  // the click moved focus onto the button; hand it back so typing can continue
  input.focus();
}

function showLoginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.remove('ok');
  el.hidden = false;
  // a second failed attempt has to re-run both animations, so the classes come
  // off, a reflow is forced, then they go back on
  const card = el.closest('.login-card');
  el.classList.remove('slide-in');
  if(card) card.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('slide-in');
  if(card) card.classList.add('shake');
}

function translateAuthError(err){
  const m = (err && err.message) || '';
  if (/invalid login credentials/i.test(m)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
  if (/email not confirmed/i.test(m)) return 'هذا الحساب غير مفعّل بعد — راجع مسؤول النظام';
  if (/rate limit|too many requests/i.test(m)) return 'محاولات كثيرة جداً — انتظر دقيقة ثم حاول مجدداً';
  if (/failed to fetch|network/i.test(m)) return 'تعذّر الاتصال بالخادم — تأكد من اتصال الإنترنت';
  return 'تعذّر تسجيل الدخول: ' + m;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const busy = document.getElementById('loginBusy');
  document.getElementById('loginError').hidden = true;

async function startApp(){
  if (appStarted) return;
  appStarted = true;
  startIdleWatch();
  document.getElementById('loginGate').hidden = true;
  await renderUserChip();
  document.getElementById('userMenu').hidden = false;
  try {
    await init();
  } catch (e) {
    const reason = e && e.message;
    if (reason !== 'ACCOUNT_DISABLED' && reason !== 'EMAIL_CHANGED') throw e;
    appStarted = false;
    document.getElementById('userMenu').hidden = true;
    document.getElementById('loginGate').hidden = false;
    // signOut triggers a page reload, so the reason is carried across it
    if (reason === 'ACCOUNT_DISABLED') sessionStorage.setItem('sareemDisabled', '1');
    await sb.auth.signOut();
    if (reason === 'EMAIL_CHANGED') {
      // nothing was done wrong here, so this stays a plain note instead of going
      // through the error funnel that shakes the card
      const note = document.getElementById('loginError');
      note.textContent = 'تم تغيير بريد هذا الحساب — سجّل الدخول بالبريد الجديد';
      note.classList.add('ok');
      note.hidden = false;
      return;
    }
    showLoginError('تم إيقاف هذا الحساب — راجع الأدمن');
  }
}

async function renderUserChip(){
  const chip = document.getElementById('userChip');
  const { data: { user } } = await sb.auth.getUser();
  const email = (user && user.email) || '';
  const md = (user && user.user_metadata) || {};
  const name = [md.first_name, md.last_name].map(s => String(s || '').trim()).filter(Boolean).join(' ');
  // only trust our own encoded data URL, so a tampered metadata value can never
  // inject a src or break out of the attribute
  const avatar = (typeof md.avatar === 'string' && /^data:image\//.test(md.avatar)) ? md.avatar : '';
  chip.classList.toggle('is-name', !!name);
  chip.title = email;
  chip.innerHTML =
    (avatar ? `<img class="chip-avatar" src="${esc(avatar)}" alt="">` : '') +
    `<span class="chip-name">${esc(name || email)}</span>`;
}

async function doLogout(){
  appStarted = false;
  clearTimeout(_idleTimer);
  await sb.auth.signOut();
  location.reload();
}

// a session left open on a shared or forgotten device is an open door,
// so a quarter of an hour without any touch of the page ends it
const IDLE_LIMIT_MS = 15 * 60 * 1000;
const LAST_ACTIVITY_KEY = 'sareemLastActivity';
let _idleTimer = null;
let _lastActivityWrite = 0;
function armIdleTimer(){
  clearTimeout(_idleTimer);
  _idleTimer = setTimeout(()=>{
    sessionStorage.setItem('sareemIdle', '1');
    localStorage.removeItem(LAST_ACTIVITY_KEY);
    sb.auth.signOut();
  }, IDLE_LIMIT_MS);
  // the timer above only lives while this tab is open — closing it or letting the
  // device sleep destroys it before it ever signs out, so the last-activity stamp
  // is persisted too and boot() checks it on the way back in; the write is
  // throttled so continuous scrolling doesn't hammer localStorage
  const now = Date.now();
  if (now - _lastActivityWrite > 10000) {
    _lastActivityWrite = now;
    localStorage.setItem(LAST_ACTIVITY_KEY, String(now));
  }
}
function startIdleWatch(){
  ['pointerdown','keydown','touchstart','wheel'].forEach(ev=>
    document.addEventListener(ev, armIdleTimer, { passive:true }));
  armIdleTimer();
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT' && appStarted) location.reload();
  if (event === 'PASSWORD_RECOVERY') {
    // the link carries a one-time token, not a login: show only the password
    // form and never start the app, so whoever holds the link sees no data
    sessionStorage.setItem('sareemRecovery', '1');
    if (appStarted) location.reload();
    else showRecoveryGate();
  }
});

function showRecoveryGate(){
  const logo = document.getElementById('companyLogo');
  if (logo) document.getElementById('recoveryLogo').src = logo.src;
  document.getElementById('loginGate').hidden = true;
  document.getElementById('recoveryGate').hidden = false;
  sb.auth.getUser().then(({ data })=>{
    document.getElementById('recoveryEmail').textContent =
      'الحساب: ' + (((data && data.user) && data.user.email) || '');
  }).catch(()=>{});
}

async function changeRecoveryPassword(){
  const msg = document.getElementById('rcMsg');
  const busy = document.getElementById('rcBusy');
  const btn = document.getElementById('rcSave');
  const say = (text)=>{ msg.textContent = text; msg.hidden = false; };
  const p1 = document.getElementById('rcPass1').value;
  const p2 = document.getElementById('rcPass2').value;
  if (p1.length < 8) { say('كلمة المرور لازم تكون 8 حروف على الأقل'); return; }
  if (p1 !== p2) { say('كلمتا المرور غير متطابقتين'); return; }
  btn.disabled = true;
  busy.hidden = false;
  msg.hidden = true;
  try {
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) throw error;
    sessionStorage.removeItem('sareemRecovery');
    sessionStorage.setItem('sareemPassChanged', '1');
    await sb.auth.signOut();
    location.reload();
  } catch (e) {
    console.error('changeRecoveryPassword failed', e);
    say(_pfErrText(e));
    btn.disabled = false;
    busy.hidden = true;
  }
}

(async function boot(){
  const logo = document.getElementById('companyLogo');
  if (logo) document.getElementById('loginLogo').src = logo.src;
  if (sessionStorage.getItem('sareemDisabled')) {
    sessionStorage.removeItem('sareemDisabled');
    showLoginError('تم إيقاف هذا الحساب — راجع الأدمن');
  }
  if (sessionStorage.getItem('sareemPassChanged')) {
    sessionStorage.removeItem('sareemPassChanged');
    const note = document.getElementById('loginError');
    note.textContent = 'تم تغيير كلمة المرور — سجّل دخول بالكلمة الجديدة';
    note.classList.add('ok');
    note.hidden = false;
  }
  const movedEmail = sessionStorage.getItem('sareemEmailChanged');
  if (movedEmail) {
    sessionStorage.removeItem('sareemEmailChanged');
    const note = document.getElementById('loginError');
    note.textContent = 'تم تغيير بريدك إلى ' + movedEmail + ' — سجّل الدخول به';
    note.classList.add('ok');
    note.hidden = false;
  }
  if (sessionStorage.getItem('sareemIdle')) {
    sessionStorage.removeItem('sareemIdle');
    const idleNote = document.getElementById('loginError');
    idleNote.textContent = 'تم تسجيل الخروج تلقائياً لعدم استخدام الموقع لفترة — سجّل دخول للمتابعة';
    idleNote.classList.add('ok');
    idleNote.hidden = false;
  }
  if (/type=recovery/.test(location.hash)) {
    sessionStorage.setItem('sareemRecovery', '1');
    // the token must not stay in the address bar or the browser history
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (sessionStorage.getItem('sareemRecovery')) { showRecoveryGate(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    // a cached session survives a closed tab, and the in-page idle timer died
    // with that tab without ever signing out — so before trusting the session,
    // measure how long the device has really been idle from the persisted stamp
    // and end a forgotten login here instead of resuming into the data
    const last = Number(localStorage.getItem(LAST_ACTIVITY_KEY));
    if (last && Date.now() - last > IDLE_LIMIT_MS) {
      sessionStorage.setItem('sareemIdle', '1');
      await sb.auth.signOut();
      location.reload();
      return;
    }
    await startApp();
  }
})();
</script>
